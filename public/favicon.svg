<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Clean white container card for universal tab contrast -->
  <rect width="120" height="120" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Stylized m.C. Monogram Artwork -->
  <g fill="none" stroke="#0f172a" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- M arches -->
    <path d="M 22 62 C 18 26, 42 12, 58 36 C 74 12, 98 26, 94 62" />
    <!-- C arc -->
    <path d="M 100 28 C 78 12, 56 26, 56 48 C 56 70, 78 84, 100 70" stroke="#2563eb" />
  </g>
  <!-- Monogram Dots for M. and C. -->
  <circle cx="58" cy="68" r="5" fill="#0f172a" />
  <circle cx="101" cy="70" r="5" fill="#2563eb" />
  <!-- TM mark -->
  <text x="94" y="22" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#2563eb">TM</text>
  
  <!-- Bottom Brand Text: Maitri Ceramic -->
  <text x="60" y="104" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#0f172a" letter-spacing="-0.4">Maitri Ceramic</text>
</svg>
