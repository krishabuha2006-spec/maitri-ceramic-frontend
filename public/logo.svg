<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <!-- Top Monogram M.C. TM - Bold Stylized -->
  <g fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- M arches -->
    <path d="M 130 90 C 120 38, 160 18, 185 52 C 210 18, 250 38, 240 90" />
    <!-- C arc -->
    <path d="M 360 38 C 315 15, 260 35, 260 65 C 260 95, 315 115, 360 92" stroke="#2563eb" />
  </g>
  <!-- Monogram Dots for M. and C. -->
  <circle cx="266" cy="98" r="7" fill="#0f172a" />
  <circle cx="368" cy="98" r="7" fill="#2563eb" />
  <!-- TM mark -->
  <text x="360" y="32" font-family="'Inter', sans-serif" font-weight="900" font-size="24" fill="#2563eb">TM</text>

  <!-- Bottom Brand Text: Maitri Ceramic (Bold) -->
  <text x="250" y="148" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#0f172a" letter-spacing="-0.8">Maitri Ceramic</text>
</svg>
